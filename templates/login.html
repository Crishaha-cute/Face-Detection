{% extends "base.html" %}
{% block title %}Sign in with your face{% endblock %}
{% block page %}login{% endblock %}
{% block content %}
<section class="card">
  <h1>Sign in with your face</h1>
  <br>
  {% include "_viewfinder.html" %}
  <p id="status" class="status" role="status" aria-live="polite">Starting camera…</p>
  <button id="action" class="btn" disabled>Start face scan</button>
  <p class="alt">No account yet? <a href="{{ url_for('register_page') }}">Create one</a></p>
</section>
{% endblock %}
